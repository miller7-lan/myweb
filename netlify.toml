[build]
command = "npm run build"
publish = "dist"
functions = "netlify/functions"

[[redirects]]
from = "/downloads/*"
to = "/downloads/:splat"
status = 200
force = true

[[redirects]]
from = "/api/contact"
to = "/.netlify/functions/contact"
status = 200

[[redirects]]
from = "/api/download"
to = "/.netlify/functions/download"
status = 200

[[redirects]]
from = "/*"
to = "https://dazzle-galaxy-show.pages.dev/:splat"
status = 301
force = true
